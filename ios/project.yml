name: MagicMaker
options:
  bundleIdPrefix: com.magicmaker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    OTHER_LDFLAGS: ["$(inherited)", "-ld_classic"]
targets:
  MagicMaker:
    type: application
    platform: iOS
    dependencies:
      # Embedded in MagicMaker.app/Watch ("Embed Watch Content").
      - target: MagicMakerWatch
    sources:
      - path: MagicMaker
        excludes:
          - Info.plist
    info:
      path: MagicMaker/Info.plist
      properties:
        CFBundleDisplayName: MagicMaker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No encryption beyond what Apple provides (BLE and local-network HTTP only).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # App Store Connect rejects an iPad-capable bundle without these (error 90474).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "MagicMaker scans and sends Disney BLE packets for wand colors and show effects."
        NSBluetoothPeripheralUsageDescription: "MagicMaker transmits BLE packets to MagicBands and wands."
        NSLocalNetworkUsageDescription: "MagicMaker sends transmit commands to your Android relay over the local WiFi hotspot."
        NSLocationWhenInUseUsageDescription: "MagicMaker tags each captured packet with where it was heard, for the capture map. With Keep running in background on, it also uses location to keep running while you use other apps."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        BGTaskSchedulerPermittedIdentifiers: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Com.lightwave.mmios
        # Set by the TestFlight workflow after each upload (.github/workflows/ios-testflight.yml).
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "22"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
  # The Apple Watch app (docs/WATCH_APP.md). Added to project.pbxproj by tools/add_watch_target.py.
  MagicMakerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MagicMakerWatch
        excludes:
          - Info.plist
      # The iPhone <-> watch protocol, compiled into both targets.
      - path: MagicMaker/Watch/WatchProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Com.lightwave.mmios.watchkitapp
        # Set by the TestFlight workflow with the iPhone target's: they must be equal.
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "22"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MagicMakerWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MagicMaker
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: Com.lightwave.mmios
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        OTHER_LDFLAGS: ""
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
