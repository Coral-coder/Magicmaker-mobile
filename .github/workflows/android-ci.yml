name: Android CI

# Real, always-on CI: builds the app on every push and pull request so you get a
# green/red check automatically — no tags, no secrets, no setup required.
# (Signed release builds + OTA distribution live in android-release.yml, which
# runs on version tags.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the long-deprecated 'tools' package,
          # which Google has now removed from the SDK repository — sdkmanager exits 1 with
          # "Failed to find package 'tools'" and the job dies before Gradle ever runs.
          # The runner image already ships platform-tools and the platforms we need
          # (compileSdk 34), so install nothing extra.
          packages: ''

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # The point of this workflow is the compile check above. The debug APK is only a
      # convenience download, and uploading it on every push/PR fills GitHub's artifact
      # storage quota. So only upload it on a manual run (workflow_dispatch), and even then
      # never fail the check if storage is full. The real APK lives on the release page.
      - name: Upload debug APK
        if: success() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 3
