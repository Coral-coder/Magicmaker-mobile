name: Android CI

# Real, always-on CI: builds the app on every push and pull request so you get a
# green/red check automatically — no tags, no secrets, no setup required.
# (Signed release builds + OTA distribution live in android-release.yml, which
# runs on version tags.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        # Non-fatal: the debug APK is a convenience download, not the deliverable (the
        # release page carries the real APK). Don't fail the check when GitHub's artifact
        # storage quota is hit; keep retention short so we stop filling it.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 3
