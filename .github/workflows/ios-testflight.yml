# Archives the iOS app (ios/) and (optionally) uploads it to TestFlight, driven by markers in
# the subject (first line) of the commit message of a push to main (the same scheme as the
# ePTT, ShotTrax and BingoBuddy repos):
#
#   no marker   nothing happens
#   *b          archive and sign only, as a check; nothing is uploaded
#   *u          archive and upload to TestFlight, same version, build number + 1
#
# To release a new version, tag the *u commit: `git tag v1.4.0` and push the tag with the
# branch (`git push origin main v1.4.0`). That uploads 1.4.0 as build 1. A tag on a commit
# without *b or *u does nothing here (the Android release workflow still runs on v* tags).
# Running the workflow by hand (Actions → iOS TestFlight → Run workflow) always uploads; its
# version and build fields are optional overrides.
#
# The current version and build are MARKETING_VERSION and CURRENT_PROJECT_VERSION in
# ios/MagicMaker.xcodeproj/project.pbxproj; after an upload the workflow commits the numbers it
# used back to the branch it built (that commit doesn't trigger workflows). The build number is
# also checked against what App Store Connect already has, so a build uploaded by hand from
# Xcode never collides.
#
# The archive embeds the watch app (ios/MagicMakerWatch, bundle id
# Com.lightwave.mmios.watchkitapp); docs/WATCH_APP.md. Its version and build lines in
# project.pbxproj are rewritten together with the iPhone target's.
#
# Signing is automatic ("cloud signing"): the App Store Connect API key lets Xcode create and
# use the distribution certificate and profiles, so no profiles are stored here.
# Secrets (repository secrets, copied from the ePTT repo by its "Share secrets" workflow):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   required
#   DEV_CERT_P12, DEV_CERT_PASSWORD                        optional, reuse one dev certificate
name: iOS TestFlight

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (leave empty to keep the current one)"
        required: false
      build:
        description: "Build number (leave empty for the next one)"
        required: false

permissions:
  contents: write

defaults:
  run:
    working-directory: ios

jobs:
  # Reads the *b / *u markers. Skipped outright (no runner, no minutes) unless the pushed
  # commit message contains a marker, a tag or a manual run started it; the step below then
  # checks the SUBJECT line only.
  plan:
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag' ||
      contains(github.event.head_commit.message, '*u') ||
      contains(github.event.head_commit.message, '*b')
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      upload: ${{ steps.plan.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          # Subject line only: a body that merely mentions the markers (a squash-merged PR
          # description, say) must not start an upload.
          message=$(git log -1 --format=%s)
          build=false; upload=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            build=true; upload=true
          else
            case "$message" in *'*u'*) build=true; upload=true ;; *'*b'*) build=true ;; esac
          fi
          # A tagged commit is handled by the tag's run, not the branch's, so it isn't built twice.
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$build" = true ]; then
            git fetch --quiet --tags origin
            if git tag --points-at HEAD | grep -qE '^v[0-9]+(\.[0-9]+){1,2}$'; then
              echo "Tagged commit; the tag's run handles it."; build=false; upload=false
            fi
          fi
          echo "build=$build upload=$upload"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

  upload:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
    runs-on: macos-26
    timeout-minutes: 90
    concurrency:
      group: ios-testflight-upload
      cancel-in-progress: false
    env:
      UPLOAD: ${{ needs.plan.outputs.upload }}
      PROJECT: "MagicMaker.xcodeproj"
      SCHEME: "MagicMaker"
      BUNDLE_ID: "Com.lightwave.mmios"
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (run Share secrets in the ePTT repo with repos = Magicmaker-mobile)"; exit 1; fi
          done

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Decide version and build
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          pbxproj="$PROJECT/project.pbxproj"
          current_version=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = "?([^";]+)"?;/\1/p' "$pbxproj" | sort -V | tail -1)
          current_build=$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION = "?([0-9]+)"?;/\1/p' "$pbxproj" | sort -n | tail -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-$current_version}"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version must look like 1, 1.2 or 1.2.3 (got '$version')"; exit 1
          fi
          if [ -n "$INPUT_BUILD" ]; then
            build="$INPUT_BUILD"
          else
            if [ "$version" = "$current_version" ]; then
              build=$((current_build + 1))   # same version: next build
            else
              build=1                        # new version: builds start over
            fi
            # Never reuse a number App Store Connect already has (e.g. a build uploaded from Xcode).
            if asc_next=$(python3 tools/next_build_number.py --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER_ID" \
                  --key-path "$ASC_KEY_PATH" --bundle-id "$BUNDLE_ID" --version "$version"); then
              if [ "$asc_next" -gt "$build" ]; then build="$asc_next"; fi
            else
              echo "::warning::Couldn't ask App Store Connect for its latest build; using $build"
            fi
          fi
          if ! [[ "$build" =~ ^[0-9]+$ ]]; then echo "::error::Build must be a number (got '$build')"; exit 1; fi
          echo "Current $current_version ($current_build) → building $version ($build)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"

      # Signing for the archive step. With DEV_CERT_P12 / DEV_CERT_PASSWORD set, that one
      # certificate is loaded into a throwaway keychain and reused every run. Without them,
      # Xcode creates a development certificate on each fresh runner. Nothing is revoked here.
      - name: Signing certificate
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$DEV_CERT_P12" ]; then
            echo "::warning::No DEV_CERT_P12 secret: Xcode will create a new development certificate this run"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          printf '%s' "$DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$DEV_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          echo "Signing certificate: stored ($(security find-identity -v -p codesigning "$keychain" | head -1 | sed -E 's/.*"(.*)"/\1/'))"

      - name: Select Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26+ on this runner:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      # actool compiles the watch app's asset catalog against a watchOS simulator runtime, and a
      # runner image may lack one (Xcode 26 ships none). Download it only when it is missing.
      # The runtime must match the SDK's major.minor (26.1 SDK: watchOS 26.1 or 26.1.x): with only
      # an older runtime (a newer Xcode picked above) actool fails with "No simulator runtime
      # version ... available to use with watchsimulator SDK".
      - name: watchOS platform (asset catalog compiler)
        run: |
          sdk=$(xcrun --sdk watchos --show-sdk-version 2>/dev/null || true)
          sdk_re=$(printf '%s' "$sdk" | sed 's/\./\\./g')
          runtimes=$(xcrun simctl list runtimes 2>/dev/null | grep -v 'unavailable' || true)
          if [ -n "$sdk" ] && grep -qE "^watchOS ${sdk_re}[ .]" <<< "$runtimes"; then
            echo "watchOS $sdk simulator runtime present"
          else
            echo "No watchOS ${sdk:-?} simulator runtime; downloading the watchOS platform"
            printf '%s\n' "$runtimes"
            xcodebuild -downloadPlatform watchOS || echo "::warning::Couldn't download the watchOS platform; actool may fail on the watch asset catalog"
          fi

      # ENABLE_DEBUG_DYLIB / ENABLE_PREVIEWS off, as in tools/build_device.sh: a device build that
      # links the debug dylib crashes at launch.
      # No PRODUCT_BUNDLE_IDENTIFIER here: a setting on the command line applies to EVERY target,
      # so the embedded watch app would get the iPhone's id and the build would fail. Each target
      # sets its own in project.pbxproj (Com.lightwave.mmios, Com.lightwave.mmios.watchkitapp).
      # The settings below apply to both targets, which keeps their versions in step.
      - name: Archive
        run: |
          mkdir -p build
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "build/$SCHEME.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            ENABLE_DEBUG_DYLIB=NO ENABLE_PREVIEWS=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > build/xcodebuild.log 2>&1 || {
              # Surface compiler errors as annotations (readable without downloading the log).
              # GitHub keeps only 10 annotations per step, so pack 25 errors into each one.
              grep -E '\.swift:[0-9]+:[0-9]+: error: ' build/xcodebuild.log \
                | sed -E 's#^.*/(ios/[^:]+:[0-9]+):[0-9]+: error: #\1 #' | sort -u > build/errors.txt || true
              total=$(wc -l < build/errors.txt | tr -d ' ')
              split -l 25 build/errors.txt build/errchunk_ || true
              n=0
              for f in build/errchunk_*; do
                [ -f "$f" ] || continue
                n=$((n+1)); [ "$n" -gt 8 ] && break
                msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
                echo "::error title=Swift errors part $n of $total lines::$msg"
              done
              if [ "$total" = "0" ]; then
                msg=$(grep -E 'error:|ARCHIVE FAILED|The following build commands failed' -A6 build/xcodebuild.log | tail -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
                echo "::error title=Archive failed::$msg"
              fi
              tail -80 build/xcodebuild.log
              exit 1
            }
            tail -60 build/xcodebuild.log

      # One app in the archive (the watch target has SKIP_INSTALL = YES), the watch app embedded
      # in MagicMaker.app/Watch, and its ids and numbers what App Store Connect expects.
      - name: Check the embedded watch app
        run: |
          apps="build/$SCHEME.xcarchive/Products/Applications"
          app="$apps/MagicMaker.app"
          watch="$app/Watch/MagicMakerWatch.app"
          count=$(ls "$apps" | wc -l | tr -d ' ')
          [ "$count" = "1" ] || { echo "::error::The archive holds $count apps (the watch target needs SKIP_INSTALL = YES)"; ls "$apps"; exit 1; }
          [ -d "$watch" ] || { echo "::error::No watch app at MagicMaker.app/Watch/MagicMakerWatch.app"; exit 1; }
          get() { /usr/libexec/PlistBuddy -c "Print :$2" "$1/Info.plist" 2>/dev/null; }
          fail() { echo "::error::Watch app: $1"; exit 1; }
          [ "$(get "$app" CFBundleIdentifier)" = "$BUNDLE_ID" ] || fail "iPhone app bundle id is $(get "$app" CFBundleIdentifier)"
          [ "$(get "$watch" CFBundleIdentifier)" = "$BUNDLE_ID.watchkitapp" ] || fail "bundle id $(get "$watch" CFBundleIdentifier)"
          [ "$(get "$watch" WKCompanionAppBundleIdentifier)" = "$BUNDLE_ID" ] || fail "companion id $(get "$watch" WKCompanionAppBundleIdentifier)"
          [ "$(get "$watch" WKApplication)" = "true" ] || fail "WKApplication missing"
          [ "$(get "$watch" CFBundleVersion)" = "$(get "$app" CFBundleVersion)" ] || fail "build number differs from the iPhone app"
          [ "$(get "$watch" CFBundleShortVersionString)" = "$(get "$app" CFBundleShortVersionString)" ] || fail "version differs from the iPhone app"
          [ "$(get "$watch" CFBundleVersion)" = "$BUILD_NUMBER" ] || fail "build number $(get "$watch" CFBundleVersion), expected $BUILD_NUMBER"
          echo "Watch app: $(get "$watch" CFBundleIdentifier) $(get "$watch" CFBundleShortVersionString) ($(get "$watch" CFBundleVersion))"

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "build/$SCHEME.xcarchive" \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded $VERSION ($BUILD_NUMBER). It appears in TestFlight after Apple finishes processing (usually 5 to 20 minutes)."
          echo "### TestFlight: uploaded $VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      # TestFlight crash reports need the symbols, and the archive is gone with the runner.
      - name: Keep dSYMs
        if: env.UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-dSYMs-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
          path: ios/build/${{ env.SCHEME }}.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 7

      - name: Record the version and build
        if: env.UPLOAD == 'true'
        run: |
          # On the branch that was built; a tag or an old-style run records on main.
          branch="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then branch=main; fi
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          # Every line, so the iPhone and watch targets (Debug and Release) stay in step: App Store
          # Connect rejects a watch app whose version or build differs from the iPhone app's.
          sed -i '' -E "s/^([[:space:]]*MARKETING_VERSION = )[^;]*;/\1$VERSION;/" "$PROJECT/project.pbxproj"
          sed -i '' -E "s/^([[:space:]]*CURRENT_PROJECT_VERSION = )[^;]*;/\1$BUILD_NUMBER;/" "$PROJECT/project.pbxproj"
          sed -i '' -E "s/^([[:space:]]*MARKETING_VERSION: ).*/\1\"$VERSION\"/" project.yml
          sed -i '' -E "s/^([[:space:]]*CURRENT_PROJECT_VERSION: ).*/\1\"$BUILD_NUMBER\"/" project.yml
          stale=$( { grep -E '^[[:space:]]*MARKETING_VERSION = ' "$PROJECT/project.pbxproj" | grep -vF "MARKETING_VERSION = $VERSION;" || true; \
                     grep -E '^[[:space:]]*CURRENT_PROJECT_VERSION = ' "$PROJECT/project.pbxproj" | grep -vF "CURRENT_PROJECT_VERSION = $BUILD_NUMBER;" || true; } )
          if [ -n "$stale" ]; then echo "::error::Version lines left unchanged in project.pbxproj: $stale"; exit 1; fi
          git add "$PROJECT/project.pbxproj" project.yml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "TestFlight: $VERSION ($BUILD_NUMBER)"
          git push origin "$branch"

      - name: Remove keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/signing.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true; fi
