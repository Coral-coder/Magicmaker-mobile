# Copies this repo's App Store Connect and signing secrets into Dev_deploy_setup (or any other
# repos of the same owner), which then hands them on to new app repos. GitHub never shows a
# secret's value, so a workflow that already has them is the only way to copy them. Values go
# straight from the runner into GitHub Secrets: nothing is printed.
#
# Needs a SECRETS (or SECRETS_TOKEN) secret here: a fine-grained token that includes the target repos with
# "Secrets: Read and write". Run it from Actions → Share secrets → Run workflow.
name: Share secrets

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositories to copy into (names, same owner)"
        required: true
        default: "Dev_deploy_setup"
      include_token:
        description: "Also copy SECRETS_TOKEN itself (only if the target doesn't have its own)"
        type: boolean
        default: false
      android:
        description: "Also copy the Android release keystore (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
        type: boolean
        default: false
      apple:
        description: "Copy the Apple secrets"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the secrets
        env:
          SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN || secrets.SECRET_TOKEN || secrets.SECRETS }}
          TARGET_REPOS: ${{ inputs.repos }}
          SHARED_SECRETS: >-
            ${{ inputs.apple && 'APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEV_CERT_P12 DEV_CERT_PASSWORD APNS_KEY_P8 APNS_KEY_ID BUILD_CERTIFICATE_P12_BASE64 P12_PASSWORD' || '' }}
            ${{ inputs.android && 'KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD' || '' }}
            ${{ inputs.include_token && 'SECRETS_TOKEN' || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          BUILD_CERTIFICATE_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SECRETS_TOKEN" ]; then echo "::error::Add a SECRETS_TOKEN secret first (see the comment at the top of share-secrets.yml)"; exit 1; fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pynacl
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import base64, json, os, sys, urllib.error, urllib.request
          from nacl import encoding, public

          def call(method, url, body=None):
              headers = {"Authorization": f"Bearer {os.environ['SECRETS_TOKEN']}",
                         "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
              data = json.dumps(body).encode() if body is not None else None
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=data, method=method, headers=headers), timeout=30) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  sys.exit(f"::error::{method} {url} failed: HTTP {e.code} {e.read().decode(errors='replace')[:300]}\n"
                           "Check that SECRETS_TOKEN covers that repository with Secrets read/write.")

          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          names = os.environ["SHARED_SECRETS"].split()
          present = {n: os.environ[n] for n in names if os.environ.get(n)}
          missing = [n for n in names if n not in present]
          if missing:
              print(f"Not set here, so not copied: {' '.join(missing)}")
          targets = os.environ["TARGET_REPOS"].replace(",", " ").split()
          if not targets or not present:
              sys.exit("::error::Nothing to do: no target repositories or no secrets set")
          for repo in targets:
              url = f"https://api.github.com/repos/{owner}/{repo}/actions/secrets"
              key = call("GET", f"{url}/public-key")
              box = public.SealedBox(public.PublicKey(key["key"].encode(), encoding.Base64Encoder()))
              for name, value in present.items():
                  sealed = base64.b64encode(box.encrypt(value.encode())).decode()
                  call("PUT", f"{url}/{name}", {"encrypted_value": sealed, "key_id": key["key_id"]})
              print(f"{owner}/{repo}: stored {' '.join(present)}")
          PY
