# Copies the Android release-signing secrets from this repo into other repos of the same owner
# as repository secrets, so their Android release workflows sign with the same keystore (an
# installed app only accepts updates signed with the key it was installed with). GitHub never
# shows a secret's value, so this is the only way to copy one. Values go straight from the
# runner into GitHub Secrets: nothing is printed. Same scheme as the ePTT repo's workflow.
#
# Needs a SECRETS_TOKEN secret: a fine-grained token that includes the target repos with
# "Secrets: Read and write". ePTT's Share secrets workflow copies its token here when run with
# include_token ticked. Run this from Actions → Share secrets → Run workflow, then delete the
# token. Re-run it whenever a secret here changes.
#
# BACKUP_TOKEN (write access to the magicmaker-backups repo) is not copied: it only fits this app.
name: Share secrets

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositories to copy into (names, same owner)"
        required: true
        default: "Sw_modcommand"

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the secrets
        env:
          SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}
          TARGET_REPOS: ${{ inputs.repos }}
          SHARED_SECRETS: >-
            KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            UPDATE_TOKEN
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [ -z "$SECRETS_TOKEN" ]; then echo "::error::Add a SECRETS_TOKEN secret first (see the comment at the top of share-secrets.yml)"; exit 1; fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pynacl
          "$RUNNER_TEMP/venv/bin/python" tools/share_secrets.py
