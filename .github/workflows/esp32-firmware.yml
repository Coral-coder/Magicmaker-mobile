name: ESP32 Firmware

# Builds the ESP32 transmitter sketch on GitHub's runners (which have full network
# access, unlike a sandbox) for both supported boards and publishes one flashable,
# merged image per board (each flashed at offset 0x0) as a GitHub Release:
#   magicmaker-esp32.bin      classic ESP32           (4MB, bootloader at 0x1000)
#   magicmaker-heltec-v3.bin  Heltec WiFi LoRa 32 V3  (ESP32-S3, 8MB, bootloader at 0x0)
# flash.ps1 / flash.sh detect which board is plugged in and flash the matching image -
# no local Arduino toolchain needed.
# Also published: the app-only images the iPhone sends over Bluetooth (OTA, firmware 1.2+)
#   magicmaker-esp32-app.bin, magicmaker-heltec-v3-app.bin   (= the merged image from 0x10000)
# plus firmware.json (version from the image's "MMFW:<version>:<board>" marker, sizes, MD5s;
# tools/firmware_manifest.py) and MagicMaker-Flasher-Windows.zip (flash.bat + images).
# On main the images are committed back too: merged -> next to the flashers and into the web
# flasher (web/flasher/, deployed by pages.yml), app images -> ios/MagicMaker/Firmware/ so the
# next iPhone build carries them.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firmware/esp32-transmitter/**.ino"
      - "firmware/esp32-transmitter/**.h"
      - "firmware/esp32-transmitter/**.cpp"
      - "tools/firmware_manifest.py"
      - ".github/workflows/esp32-firmware.yml"

permissions:
  contents: write

# One run at a time, oldest first, so an older build can never commit its bins on top of a
# newer one's (a queued run is superseded by a newer queued run, never cancelled mid-build).
concurrency:
  group: esp32-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ESP32_CORE: "2.0.17"
      NIMBLE_VER: "1.4.3"
      U8G2_VER: "2.35.30"
      ESPTOOL_VER: "4.8.1"
      FQBN_ESP32: "esp32:esp32:esp32"
      FQBN_HELTEC_V3: "esp32:esp32:heltec_wifi_lora_32_V3"
      SKETCH: "firmware/esp32-transmitter"
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core + libraries + esptool
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
          arduino-cli lib install "NimBLE-Arduino@${NIMBLE_VER}"
          # OLED driver; the sketch only uses it in the Heltec V3 build.
          arduino-cli lib install "U8g2@${U8G2_VER}"
          python3 -m pip install --quiet "esptool==${ESPTOOL_VER}"

      - name: Compile (classic ESP32)
        run: |
          arduino-cli compile --fqbn "$FQBN_ESP32" --output-dir build-esp32 --log-level warn "$SKETCH"
          echo "--- build outputs ---"
          ls -la build-esp32

      - name: Compile (Heltec WiFi LoRa 32 V3)
        run: |
          arduino-cli compile --fqbn "$FQBN_HELTEC_V3" --output-dir build-heltec-v3 --log-level warn "$SKETCH"
          echo "--- build outputs ---"
          ls -la build-heltec-v3

      - name: Merge into one flashable image per board (flash at 0x0)
        run: |
          BOOT0=$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin | head -1)

          # Classic ESP32: 4MB flash, bootloader at 0x1000.
          APP=$(ls build-esp32/*.ino.bin | head -1)
          BOOT=$(ls build-esp32/*.bootloader.bin | head -1)
          PART=$(ls build-esp32/*.partitions.bin | head -1)
          echo "esp32: app=$APP boot=$BOOT part=$PART boot0=$BOOT0"
          python3 -m esptool --chip esp32 merge_bin -o magicmaker-esp32.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$BOOT" 0x8000 "$PART" 0xe000 "$BOOT0" 0x10000 "$APP"
          cp "$APP" magicmaker-esp32-app.bin    # what an OTA update sends

          # Heltec WiFi LoRa 32 V3 (ESP32-S3FN8): 8MB flash, bootloader at 0x0.
          APP=$(ls build-heltec-v3/*.ino.bin | head -1)
          BOOT=$(ls build-heltec-v3/*.bootloader.bin | head -1)
          PART=$(ls build-heltec-v3/*.partitions.bin | head -1)
          echo "heltec-v3: app=$APP boot=$BOOT part=$PART boot0=$BOOT0"
          python3 -m esptool --chip esp32s3 merge_bin -o magicmaker-heltec-v3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 "$BOOT" 0x8000 "$PART" 0xe000 "$BOOT0" 0x10000 "$APP"
          cp "$APP" magicmaker-heltec-v3-app.bin

          ls -la magicmaker-esp32.bin magicmaker-heltec-v3.bin magicmaker-esp32-app.bin magicmaker-heltec-v3-app.bin

      # The flashers check the same thing before writing: a merged image must carry the
      # bootloader header (magic 0xE9 + chip id) where that chip's ROM looks for it, and the
      # partition table (magic AA 50) at 0x8000.
      - name: Sanity-check the images
        run: |
          python3 - <<'EOF'
          import sys

          def check(path, offset, chip_id, chip):
              b = open(path, "rb").read()
              ok = (len(b) > 100 * 1024 and b[offset] == 0xE9
                    and (b[offset + 12] | b[offset + 13] << 8) == chip_id
                    and b[0x8000:0x8002] == b"\xaa\x50")
              print(f"{path}: {len(b)} bytes, {chip} bootloader header at {offset:#x}"
                    f" + partition table at 0x8000: {'OK' if ok else 'BAD'}")
              return ok

          ok = check("magicmaker-esp32.bin", 0x1000, 0, "ESP32")
          ok = check("magicmaker-heltec-v3.bin", 0x0, 9, "ESP32-S3") and ok
          sys.exit(0 if ok else 1)
          EOF

      # Checks each app image (chip, one MMFW marker naming its board, equal to the merged
      # image from 0x10000, same version on both boards) and writes firmware.json (release
      # manifest) + manifest.json (ESP Web Tools manifest for web/flasher/).
      - name: Check the app images, write firmware.json + web flasher manifest
        id: manifest
        run: |
          VERSION=$(python3 tools/firmware_manifest.py --dir . --out manifests)
          echo "firmware version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp manifests/firmware.json firmware.json
          cat manifests/firmware.json manifests/manifest.json

      - name: Package the one-click Windows flasher
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          rm -rf MagicMaker-Flasher MagicMaker-Flasher-Windows.zip
          mkdir MagicMaker-Flasher
          cp firmware/esp32-transmitter/flash.bat firmware/esp32-transmitter/flash.ps1 \
             magicmaker-esp32.bin magicmaker-heltec-v3.bin MagicMaker-Flasher/
          cat > MagicMaker-Flasher/README.txt <<EOF
          MagicMaker ESP32 transmitter ${VERSION} - one-click flasher (Windows)

          1. Plug the board in with a USB data cable.
          2. Double-click flash.bat.

          It detects a Heltec WiFi LoRa 32 V3 (ESP32-S3) or a classic ESP32 and flashes the
          matching image. The first run downloads esptool (internet needed once).
          Can't connect? Heltec V3: hold PRG, tap RST, release PRG, double-click flash.bat
          again, and tap RST when it is done. Classic ESP32: hold BOOT while it connects.
          No COM port? Install the Silicon Labs CP210x (or WCH CH340) USB driver.

          After flashing the board advertises as MM_ESP; pick the ESP32 transmitter backend in
          the MagicMaker app. Heltec screen: dark until you press PRG.

          No Windows PC? Flash from Chrome or Edge:
            https://coral-coder.github.io/Magicmaker-mobile/flasher/
          Firmware 1.2 and newer also update over Bluetooth from the iPhone app: press PRG
          (Heltec) or BOOT (DevKit) on the board, then start the update in the app within 2 min.
          EOF
          python3 -m zipfile -c MagicMaker-Flasher-Windows.zip MagicMaker-Flasher/
          python3 -m zipfile -l MagicMaker-Flasher-Windows.zip

      - name: Publish firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esp32-firmware
          name: ESP32 firmware ${{ steps.manifest.outputs.version }} (latest)
          body: |
            Prebuilt MagicMaker ESP32 transmitter firmware ${{ steps.manifest.outputs.version }}: one merged image per board, each flashed at offset 0x0.
            - `magicmaker-esp32.bin`: classic ESP32 (DevKit / WROOM / WROVER, 4MB flash).
            - `magicmaker-heltec-v3.bin`: Heltec WiFi LoRa 32 V3 / V3.1 / V3.2 (ESP32-S3, 8MB flash). The OLED stays dark to save power; press PRG to light it.

            Easiest: the web flasher, https://coral-coder.github.io/Magicmaker-mobile/flasher/ (Chrome or Edge; it picks the image for the chip it finds).
            Windows, one click: download `MagicMaker-Flasher-Windows.zip`, unzip, double-click `flash.bat`.
            Or `./flash.ps1` (Windows) / `./flash.sh` (macOS/Linux) from firmware/esp32-transmitter/.
            They detect which board is plugged in and flash the matching .bin committed next to them
            (force one with `-Board esp32` / `-Board heltec-v3`, or `--board` for flash.sh).

            Over-the-air (firmware 1.2+ already on the board): the iPhone app sends the app-only image
            (`magicmaker-esp32-app.bin` / `magicmaker-heltec-v3-app.bin`, the merged image from 0x10000)
            over Bluetooth after PRG/BOOT is pressed on the board. `firmware.json` lists the version, sizes and MD5s.
          files: |
            magicmaker-esp32.bin
            magicmaker-heltec-v3.bin
            magicmaker-esp32-app.bin
            magicmaker-heltec-v3-app.bin
            firmware.json
            MagicMaker-Flasher-Windows.zip
          fail_on_unmatched_files: true

      # Also commit the built images into the repo so a plain `git pull` delivers the firmware
      # and the flashers can flash it with no download: merged images next to the flashers and
      # (with both manifests) into the web flasher, app images into the iPhone app's bundle.
      # None of these .bin/.json paths matches this workflow's .ino/.h/.cpp/script/workflow
      # triggers, and [skip ci] + the GITHUB_TOKEN push start no workflow, so this won't loop.
      # pages.yml redeploys the flasher when this run finishes (workflow_run).
      - name: Commit prebuilt bins into the repo
        if: github.ref == 'refs/heads/main'   # a manual run on another branch only publishes
        run: |
          cp magicmaker-esp32.bin magicmaker-heltec-v3.bin firmware/esp32-transmitter/
          mkdir -p web/flasher ios/MagicMaker/Firmware
          cp magicmaker-esp32.bin magicmaker-heltec-v3.bin manifests/firmware.json manifests/manifest.json web/flasher/
          cp magicmaker-esp32-app.bin magicmaker-heltec-v3-app.bin ios/MagicMaker/Firmware/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/esp32-transmitter/magicmaker-esp32.bin firmware/esp32-transmitter/magicmaker-heltec-v3.bin \
            web/flasher/magicmaker-esp32.bin web/flasher/magicmaker-heltec-v3.bin \
            web/flasher/firmware.json web/flasher/manifest.json \
            ios/MagicMaker/Firmware/magicmaker-esp32-app.bin ios/MagicMaker/Firmware/magicmaker-heltec-v3-app.bin
          if git diff --cached --quiet; then
            echo "prebuilt bins unchanged"
            exit 0
          fi
          git commit -m "ci: update prebuilt ESP32 firmware ${{ steps.manifest.outputs.version }} (classic + Heltec V3) [skip ci]"
          # main may have moved while we built (other pushes): replay the bin commit on top.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (main moved?) - rebasing onto origin/main, attempt $attempt"
            git pull --rebase origin main
          done
          echo "could not push the prebuilt bins"
          exit 1
