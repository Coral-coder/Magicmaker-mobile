name: iOS core parity

# The Android Kotlin core is the reference for packet logic; the Swift core in
# ios/MagicMaker/Core must return the same answers.
#
#   parity   compiles the Swift core with ios/ParityCheck/main.swift on Linux and runs it
#            against ios/ParityCheck/vectors.json (what the Android core returns).
#   vectors  regenerates vectors.json from the Android sources (tools/parity) and fails if the
#            committed file is out of date, so the Swift core is never checked against old answers.
#   vfd      compiles the Foundation-only VFD theme core (ios/MagicMaker/VFD: glyphs, frame buffer,
#            widgets) with ios/VFDCheck/main.swift and replays tools/vfd/golden/ops.txt, which must
#            give tools/vfd/golden/expected.txt (what the Python preview renderer draws).
#   sync     compiles the Foundation-only SYNC codec (ios/MagicMaker/Sync: record/message codecs,
#            framing, SHA-256/HMAC, ledger, events, routing, session state machine) with
#            ios/SyncCheck/main.swift and checks it against tools/sync/vectors.json and the golden
#            transcripts in tools/sync/transcripts (what tools/sync/sync_ref.py computes).
#
# Regenerate the VFD golden files after changing tools/vfd/vfd.py or widgets.py:
#   python3 tools/vfd/golden.py
#
# Regenerate the sync vectors and transcripts after changing tools/sync/sync_ref.py:
#   python3 tools/sync/gen_vectors.py
#
# Regenerate the vectors after changing the Android core:
#   cd tools/parity && ../../android/gradlew --no-daemon -q run

on:
  push:
    branches: [main]
    paths:
      - "ios/MagicMaker/Core/**"
      - "ios/ParityCheck/**"
      - "android/app/src/main/java/com/magicmaker/android/core/**"
      - "tools/parity/**"
      # The generator also reads these two: the E905 zone-mask list and the packets in the notes.
      - "android/app/src/main/java/com/magicmaker/android/ui/LabPacketBuilderPanel.kt"
      - "docs/PROTOCOL.md"
      - "ios/MagicMaker/VFD/**"
      - "ios/VFDCheck/**"
      - "tools/vfd/**"
      - "ios/MagicMaker/Sync/**"
      - "ios/SyncCheck/**"
      - "tools/sync/**"
      - ".github/workflows/ios-core-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-core-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Swift core matches Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # GitHub shows at most 10 annotations per step. This packs the first 60 problem lines
      # into at most 8 ::error:: commands, with %0A standing in for the newlines inside each.
      - name: Annotation helper
        run: |
          cat > /tmp/annotate.sh <<'EOF'
          #!/usr/bin/env bash
          # usage: annotate.sh <title> <file with one problem per line>
          head -n 60 "$2" | awk -v title="$1" '
            {
              gsub(/%/, "%25")
              gsub(/\r/, "%0D")
              block = (count % 8 == 0) ? $0 : block "%0A" $0
              count++
              if (count % 8 == 0) { printf "::error title=%s::%s\n", title, block; block = "" }
            }
            END { if (count % 8 != 0) printf "::error title=%s::%s\n", title, block }
          '
          EOF
          chmod +x /tmp/annotate.sh

      # Every Core file is listed: they are one module (LabPacketBuilder.swift extends a type
      # declared in MdeThemeCatalog.swift), and a new file must be added here on purpose.
      # Swift 5 mode, as in the app target.
      - name: Compile the Swift core with the parity checker
        run: |
          set -o pipefail
          if ! swiftc -O -swift-version 5 -o /tmp/parity \
            ios/MagicMaker/Core/BandEffectModel.swift \
            ios/MagicMaker/Core/DisneyTlv.swift \
            ios/MagicMaker/Core/HexUtils.swift \
            ios/MagicMaker/Core/LabPacketBuilder.swift \
            ios/MagicMaker/Core/LabPacketTools.swift \
            ios/MagicMaker/Core/LabSegmentEditor.swift \
            ios/MagicMaker/Core/LivePacketSection.swift \
            ios/MagicMaker/Core/LogAnalysis.swift \
            ios/MagicMaker/Core/MagicClassifier.swift \
            ios/MagicMaker/Core/MagicModels.swift \
            ios/MagicMaker/Core/MapMath.swift \
            ios/MagicMaker/Core/MdeLightSequence.swift \
            ios/MagicMaker/Core/MdeThemeCatalog.swift \
            ios/MagicMaker/Core/PacketBuilder.swift \
            ios/MagicMaker/Core/PacketPatterns.swift \
            ios/MagicMaker/Core/PresetCatalog.swift \
            ios/MagicMaker/Core/SessionLog.swift \
            ios/MagicMaker/Core/StarlightColors.swift \
            ios/MagicMaker/Core/StarlightSerial.swift \
            ios/MagicMaker/Core/TransmitTiming.swift \
            ios/ParityCheck/main.swift 2>&1 | tee /tmp/parity-compile.log
          then
            grep -E "error:" /tmp/parity-compile.log > /tmp/parity-problems.txt || true
            if [ ! -s /tmp/parity-problems.txt ]; then
              tail -n 60 /tmp/parity-compile.log > /tmp/parity-problems.txt
            fi
            /tmp/annotate.sh "Swift core does not compile on Linux" /tmp/parity-problems.txt
            exit 1
          fi

      - name: Compare the Swift core with the Android vectors
        run: |
          set -o pipefail
          if ! /tmp/parity ios/ParityCheck/vectors.json 2>&1 | tee /tmp/parity-run.log
          then
            # The summary first, then the mismatches. If the checker died before printing
            # either, fall back to the end of its output.
            grep -E "^PARITY:" /tmp/parity-run.log > /tmp/parity-problems.txt || true
            grep -E "^MISMATCH " /tmp/parity-run.log >> /tmp/parity-problems.txt || true
            if [ ! -s /tmp/parity-problems.txt ]; then
              tail -n 60 /tmp/parity-run.log > /tmp/parity-problems.txt
            fi
            /tmp/annotate.sh "Swift core differs from Android" /tmp/parity-problems.txt
            exit 1
          fi
          grep -E "^(NOTE|PARITY):" /tmp/parity-run.log >> "$GITHUB_STEP_SUMMARY" || true

  vectors:
    name: Committed vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The Android project's Gradle wrapper, pointed at the generator project.
      - name: Regenerate vectors from the Android core
        run: |
          if ! ./android/gradlew -p tools/parity --no-daemon -q run; then
            echo "::error title=Parity vector generator failed::tools/parity did not build or run against the Android core. See the log of this step."
            exit 1
          fi

      - name: Committed vectors match the Android core
        run: |
          if ! git diff --exit-code --stat -- ios/ParityCheck/vectors.json; then
            echo "::error file=ios/ParityCheck/vectors.json,title=Parity vectors are stale::ios/ParityCheck/vectors.json does not match the Android core. Regenerate it with 'cd tools/parity && ../../android/gradlew --no-daemon -q run' and commit the result."
            exit 1
          fi

  vfd:
    name: VFD core matches the Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Same helper as the parity job: the first 60 problem lines in at most 8 ::error:: commands.
      - name: Annotation helper
        run: |
          cat > /tmp/annotate.sh <<'EOF'
          #!/usr/bin/env bash
          # usage: annotate.sh <title> <file with one problem per line>
          head -n 60 "$2" | awk -v title="$1" '
            {
              gsub(/%/, "%25")
              gsub(/\r/, "%0D")
              block = (count % 8 == 0) ? $0 : block "%0A" $0
              count++
              if (count % 8 == 0) { printf "::error title=%s::%s\n", title, block; block = "" }
            }
            END { if (count % 8 != 0) printf "::error title=%s::%s\n", title, block }
          '
          EOF
          chmod +x /tmp/annotate.sh

      # The golden files must be what the Python reference draws today.
      - name: Golden files are current
        run: |
          if ! python3 tools/vfd/golden.py --check; then
            echo "::error file=tools/vfd/golden/expected.txt,title=VFD golden files are stale::tools/vfd/golden does not match tools/vfd/golden.py and the Python renderer. Regenerate it with 'python3 tools/vfd/golden.py' and commit the result."
            exit 1
          fi

      # The three Foundation-only VFD files are one module with the checker. Swift 5 mode, as in
      # the app target.
      - name: Compile the VFD core with the golden checker
        run: |
          set -o pipefail
          if ! swiftc -O -swift-version 5 -o /tmp/vfdcheck \
            ios/MagicMaker/VFD/VFDGlyphs.swift \
            ios/MagicMaker/VFD/VFDCore.swift \
            ios/MagicMaker/VFD/VFDWidgets.swift \
            ios/VFDCheck/main.swift 2>&1 | tee /tmp/vfd-compile.log
          then
            grep -E "error:" /tmp/vfd-compile.log > /tmp/vfd-problems.txt || true
            if [ ! -s /tmp/vfd-problems.txt ]; then
              tail -n 60 /tmp/vfd-compile.log > /tmp/vfd-problems.txt
            fi
            /tmp/annotate.sh "VFD core does not compile on Linux" /tmp/vfd-problems.txt
            exit 1
          fi

      # On a mismatch: the checker's summary and first mismatches, then the first differing lines
      # of the readable per-page dumps (< Python reference, > Swift). A checker that died before
      # its summary (a trap) gets the end of its output first instead.
      - name: Compare the Swift VFD core with the Python reference
        run: |
          set -o pipefail
          if ! /tmp/vfdcheck tools/vfd/golden 2>&1 | tee /tmp/vfd-run.log
          then
            grep -E "^VFD:" /tmp/vfd-run.log > /tmp/vfd-problems.txt || true
            if [ ! -s /tmp/vfd-problems.txt ]; then
              echo "VFD: the checker stopped before its summary; the end of its output:" > /tmp/vfd-problems.txt
              tail -n 20 /tmp/vfd-run.log >> /tmp/vfd-problems.txt
            fi
            grep -E "^MISMATCH " /tmp/vfd-run.log | head -n 25 >> /tmp/vfd-problems.txt || true
            python3 tools/vfd/golden.py --dump /tmp/vfd-python > /dev/null || true
            /tmp/vfdcheck tools/vfd/golden --dump /tmp/vfd-swift > /dev/null 2>&1 || true
            diff -r /tmp/vfd-python /tmp/vfd-swift 2>&1 | grep -E "^(diff|Only|[<>])" | cut -c1-300 \
              | head -n 30 >> /tmp/vfd-problems.txt || true
            if [ ! -s /tmp/vfd-problems.txt ]; then
              tail -n 60 /tmp/vfd-run.log > /tmp/vfd-problems.txt
            fi
            /tmp/annotate.sh "Swift VFD core differs from the Python reference" /tmp/vfd-problems.txt
            exit 1
          fi
          grep -E "^VFD:" /tmp/vfd-run.log >> "$GITHUB_STEP_SUMMARY" || true

  sync:
    name: Swift sync codec matches the shared vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Same helper as the parity job: the first 60 problem lines in at most 8 ::error:: commands.
      - name: Annotation helper
        run: |
          cat > /tmp/annotate.sh <<'EOF'
          #!/usr/bin/env bash
          # usage: annotate.sh <title> <file with one problem per line>
          head -n 60 "$2" | awk -v title="$1" '
            {
              gsub(/%/, "%25")
              gsub(/\r/, "%0D")
              block = (count % 8 == 0) ? $0 : block "%0A" $0
              count++
              if (count % 8 == 0) { printf "::error title=%s::%s\n", title, block; block = "" }
            }
            END { if (count % 8 != 0) printf "::error title=%s::%s\n", title, block }
          '
          EOF
          chmod +x /tmp/annotate.sh

      # That the committed vectors and transcripts are current (gen_vectors.py --check) and pass the
      # Python model harness is checked by the "vectors" job of .github/workflows/sync-vectors.yml.

      # Every Sync file is listed: they are one module, and a new file must be added here on purpose
      # (and to ios/MagicMaker.xcodeproj). Swift 5 mode, as in the app target.
      - name: Compile the Swift sync codec with the vector checker
        run: |
          set -o pipefail
          if ! swiftc -O -swift-version 5 -o /tmp/synccheck \
            ios/MagicMaker/Sync/SyncBytes.swift \
            ios/MagicMaker/Sync/SyncConstants.swift \
            ios/MagicMaker/Sync/SyncCrypto.swift \
            ios/MagicMaker/Sync/SyncEvents.swift \
            ios/MagicMaker/Sync/SyncFrames.swift \
            ios/MagicMaker/Sync/SyncLedger.swift \
            ios/MagicMaker/Sync/SyncMessages.swift \
            ios/MagicMaker/Sync/SyncRecord.swift \
            ios/MagicMaker/Sync/SyncRouting.swift \
            ios/MagicMaker/Sync/SyncSession.swift \
            ios/MagicMaker/Sync/SyncText.swift \
            ios/SyncCheck/main.swift 2>&1 | tee /tmp/sync-compile.log
          then
            grep -E "error:" /tmp/sync-compile.log > /tmp/sync-problems.txt || true
            if [ ! -s /tmp/sync-problems.txt ]; then
              tail -n 60 /tmp/sync-compile.log > /tmp/sync-problems.txt
            fi
            /tmp/annotate.sh "Swift sync codec does not compile on Linux" /tmp/sync-problems.txt
            exit 1
          fi

      # On a mismatch: the checker's summary, then its first MISMATCH lines. A checker that died
      # before its summary (a trap) gets the end of its output instead.
      - name: Check the Swift sync codec against the vectors and transcripts
        run: |
          set -o pipefail
          if ! /tmp/synccheck tools/sync 2>&1 | tee /tmp/sync-run.log
          then
            grep -E "^SYNC:" /tmp/sync-run.log > /tmp/sync-problems.txt || true
            if [ ! -s /tmp/sync-problems.txt ]; then
              echo "SYNC: the checker stopped before its summary; the end of its output:" > /tmp/sync-problems.txt
              tail -n 20 /tmp/sync-run.log >> /tmp/sync-problems.txt
            fi
            grep -E "^MISMATCH " /tmp/sync-run.log | cut -c1-400 | head -n 40 >> /tmp/sync-problems.txt || true
            /tmp/annotate.sh "Swift sync codec differs from tools/sync" /tmp/sync-problems.txt
            exit 1
          fi
          grep -E "^(NOTE|SYNC):" /tmp/sync-run.log >> "$GITHUB_STEP_SUMMARY" || true
