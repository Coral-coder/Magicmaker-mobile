name: Android Release & OTA

# Builds an APK in the cloud and publishes it to a GitHub Release so you can
# download + sideload it manually, and so the app's updater finds it.
#
# The repo is PUBLIC, so Release assets are public: the APK must hold no secrets.
# It bakes in no token. The app's updater reads public Releases without one, and
# the cloud-dictionary token is entered on the phone (Settings -> CLOUD DICTIONARY).
# See docs/GOING_PUBLIC.md.
#
# Zero-setup mode: with no secrets configured, this builds a debug-signed APK —
# installable manually, but NOT OTA-upgradable (needs the stable keystore).
#
# The same workflow upgrades automatically when you add secrets:
#   - KEYSTORE_BASE64 (+ password/alias)  -> builds a SIGNED release APK (needed for OTA)
#     The keystore only signs the APK; it is never part of it.
#
# Trigger by pushing a version tag:  git tag v1.0.1 && git push origin v1.0.1
# Or run it manually (Actions tab) and enter a version like v1.0.1 — it will
# create that tag + Release for you (handy when tag pushes are restricted).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version, e.g. v1.1.0 (a -YYYYMMDD-HHMM stamp is appended). Blank = use .github/RELEASE_VERSION + stamp."
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      # Releasing where tag pushes are restricted: bump .github/RELEASE_VERSION
      # on main and this publishes that version.
      - ".github/RELEASE_VERSION"

permissions:
  contents: write # needed to create the GitHub Release + tag

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the long-deprecated 'tools' package,
          # which Google has now removed from the SDK repository — sdkmanager exits 1 with
          # "Failed to find package 'tools'" and the job dies before Gradle ever runs.
          # The runner image already ships platform-tools and the platforms we need
          # (compileSdk 34), so install nothing extra.
          packages: ''

      - name: Resolve version
        id: ver
        run: |
          # Build stamp (UTC) appended to the base so every build is uniquely versioned
          # without hand-bumping a patch number. e.g. base "v1.1.0" -> "v1.1.0-20260628-1255".
          STAMP="$(date -u +%Y%m%d-%H%M)"
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}-${STAMP}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -f .github/RELEASE_VERSION ]; then
            BASE="$(tr -d ' \t\r\n' < .github/RELEASE_VERSION)"
            echo "version=${BASE}-${STAMP}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release tag before the build
        # The Release step tags github.sha at the END of the ~8-minute build. If main gains a
        # .github/workflows change meanwhile, GitHub refuses GITHUB_TOKEN (it can't have the
        # "workflows" permission) a new tag on the older commit: most likely why v1.3.15 failed
        # with 403 "Resource not accessible by integration". Tagging now, seconds after the push,
        # closes that window. A tag pushed with GITHUB_TOKEN starts no other workflow run.
        if: ${{ steps.ver.outputs.publish == 'true' && !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ steps.ver.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Decide build type (signed release vs debug)
        id: plan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "::notice::Keystore present — building a SIGNED release APK."
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "::notice::No keystore secret — building a DEBUG APK (installable; not OTA-upgradable to release builds without a reinstall)."
          fi

      - name: Build APK
        working-directory: android
        env:
          MM_KEYSTORE_FILE: ${{ steps.plan.outputs.keystore }}
          MM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # No -PmmUpdateToken / -PmmBackupToken: the APK is a public download, so it carries no
        # token (both properties stay optional for local private builds).
        run: |
          ./gradlew ${{ steps.plan.outputs.task }} --no-daemon \
            -PmmVersionCode=${{ github.run_number }} \
            -PmmVersionName="${{ steps.ver.outputs.version }}"

      - name: Upload APK as workflow artifact
        # Only when this run publishes no Release (no version to publish): then this is the one
        # place the APK lands. A published run already has the public Release asset, so a second
        # copy would only fill artifact storage. The APK holds no secrets either way.
        if: ${{ steps.ver.outputs.publish != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: magicmaker-apk
          path: ${{ steps.plan.outputs.apk }}
          if-no-files-found: warn
          retention-days: 3

      - name: Publish APK to GitHub Release
        if: ${{ steps.ver.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.plan.outputs.apk }}
          fail_on_unmatched_files: true
