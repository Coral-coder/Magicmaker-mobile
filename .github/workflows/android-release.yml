name: Android Release & OTA

# Builds an APK in the cloud and publishes it to a GitHub Release so you can
# download + sideload it manually. Stays fully private (private repo + private
# release assets).
#
# Zero-setup mode (current): with no secrets configured, this builds a
# debug-signed APK — installable straight away, no keystore/Firebase needed.
#
# The same workflow upgrades automatically when you add secrets:
#   - KEYSTORE_BASE64 (+ password/alias)  -> builds a SIGNED release APK
#   - FIREBASE_APP_ID (+ service account) -> also pushes to App Distribution (OTA)
#
# Trigger by pushing a version tag:  git tag v1.0.1 && git push origin v1.0.1
# Or run manually from the Actions tab (workflow_dispatch) for just an artifact.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_APP_ID != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decide build type (signed release vs debug)
        id: plan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "::notice::Keystore present — building a SIGNED release APK."
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "::notice::No keystore secret — building a DEBUG APK (installable; not OTA-upgradable to release builds without a reinstall)."
          fi

      - name: Write google-services.json (only if configured)
        if: ${{ env.HAS_GOOGLE_SERVICES == 'true' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build APK
        working-directory: android
        env:
          MM_KEYSTORE_FILE: ${{ steps.plan.outputs.keystore }}
          MM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew ${{ steps.plan.outputs.task }} --no-daemon \
            -PmmVersionCode=${{ github.run_number }} \
            -PmmVersionName="${{ github.ref_name }}"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicmaker-apk
          path: ${{ steps.plan.outputs.apk }}
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.plan.outputs.apk }}
          fail_on_unmatched_files: true

      - name: Distribute to Firebase App Distribution (only if configured)
        if: ${{ env.HAS_FIREBASE == 'true' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: ${{ steps.plan.outputs.apk }}
          releaseNotes: "${{ github.ref_name }} — ${{ github.sha }}"
