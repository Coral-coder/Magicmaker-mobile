name: Android Release & OTA

# Builds an APK in the cloud and publishes it to a GitHub Release so you can
# download + sideload it manually. Stays fully private (private repo + private
# release assets).
#
# Zero-setup mode: with no secrets configured, this builds a debug-signed APK —
# installable manually, but NOT OTA-upgradable (needs the stable keystore).
#
# The same workflow upgrades automatically when you add secrets:
#   - KEYSTORE_BASE64 (+ password/alias)  -> builds a SIGNED release APK (needed for OTA)
#   - UPDATE_TOKEN (fine-grained read-only PAT) -> baked in so the app can self-update
#     from this repo's GitHub Releases.
#
# Trigger by pushing a version tag:  git tag v1.0.1 && git push origin v1.0.1
# Or run manually from the Actions tab (workflow_dispatch) for just an artifact.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decide build type (signed release vs debug)
        id: plan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "::notice::Keystore present — building a SIGNED release APK."
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "::notice::No keystore secret — building a DEBUG APK (installable; not OTA-upgradable to release builds without a reinstall)."
          fi

      - name: Build APK
        working-directory: android
        env:
          MM_KEYSTORE_FILE: ${{ steps.plan.outputs.keystore }}
          MM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          ./gradlew ${{ steps.plan.outputs.task }} --no-daemon \
            -PmmVersionCode=${{ github.run_number }} \
            -PmmVersionName="${{ github.ref_name }}" \
            -PmmUpdateToken="$UPDATE_TOKEN"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicmaker-apk
          path: ${{ steps.plan.outputs.apk }}
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.plan.outputs.apk }}
          fail_on_unmatched_files: true
