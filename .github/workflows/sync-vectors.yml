name: Sync vectors

# SYNC v1 (docs/SYNC_PROTOCOL.md, sync hub spec phase P1): tools/sync/vectors.json and
# tools/sync/transcripts/*.json are the contract every codec must reproduce byte for byte.
#
#   vectors  the committed vectors and transcripts are exactly what tools/sync/gen_vectors.py
#            produces from sync_ref.py now (--check), and the Python model harness
#            (check_vectors.py) passes on them
#   cpp      the ESP32 hub codec (firmware/esp32-transmitter/sync_*.h) on the host:
#            firmware/esp32-transmitter/test/host, a C++17 runner over every vector group and every
#            transcript plus a gnu++11 -Werror smoke build of the headers, under ASan/UBSan
#   kotlin   the Android codec (android/app/src/main/java/com/magicmaker/android/sync) against the
#            same files: the unit tests under android/app/src/test/java/com/magicmaker/android/sync
#
# After changing tools/sync/sync_ref.py (or gen_vectors.py): run `python3 tools/sync/gen_vectors.py`,
# then `python3 tools/sync/check_vectors.py`, and commit the regenerated JSON with the change.
# Local runs: `make -C firmware/esp32-transmitter/test/host test`,
# `cd android && ./gradlew :app:testDebugUnitTest --tests '*sync*'`.

on:
  push:
    paths:
      - "tools/sync/**"
      - "firmware/esp32-transmitter/sync_*"
      - "firmware/esp32-transmitter/test/**"
      - "android/app/src/*/java/com/magicmaker/android/sync/**"
      - ".github/workflows/sync-vectors.yml"
  pull_request:
    paths:
      - "tools/sync/**"
      - "firmware/esp32-transmitter/sync_*"
      - "firmware/esp32-transmitter/test/**"
      - "android/app/src/*/java/com/magicmaker/android/sync/**"
      - ".github/workflows/sync-vectors.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: sync-vectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    name: Vectors and transcripts are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python version
        run: python3 --version

      # Builds every output twice in memory (asserting the generator is deterministic) and
      # compares it with the committed file; lists any stale, missing or extra file.
      - name: gen_vectors.py --check
        run: |
          if ! python3 tools/sync/gen_vectors.py --check; then
            echo "::error file=tools/sync/vectors.json,title=SYNC vectors are stale::tools/sync/vectors.json or transcripts/*.json do not match what tools/sync/gen_vectors.py produces from sync_ref.py. Run 'python3 tools/sync/gen_vectors.py' and commit the result."
            exit 1
          fi

      - name: Python model harness (check_vectors.py)
        run: python3 -W error tools/sync/check_vectors.py

  cpp:
    name: ESP32 hub codec (C++ host tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: g++ --version

      # AddressSanitizer cannot map its shadow memory with the 32-bit mmap randomisation some
      # runner kernels default to (it dies with "AddressSanitizer:DEADLYSIGNAL"); 28 bits is
      # the classic default and changes nothing else for this job.
      - name: Allow AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: make test
        run: make -C firmware/esp32-transmitter/test/host test

  kotlin:
    name: Android codec (Kotlin sync tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # As in android-ci.yml: the action's default list includes the removed 'tools'
          # package (sdkmanager fails on it); the runner image already has what compileSdk 34
          # needs.
          packages: ''

      # The tests find tools/sync by walking up from the module dir (android/app).
      - name: Kotlin sync tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest --tests '*sync*'
