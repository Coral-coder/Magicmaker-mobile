name: Generate Signing Keystore (one-time)

# One-time helper: creates a release signing keystore in the cloud and uploads it
# — plus the exact secret values to copy — as a downloadable artifact. No local
# tools (Java/keytool) needed.
#
# How to use:
#   1. Actions tab -> "Generate Signing Keystore (one-time)" -> Run workflow.
#   2. Open the finished run -> download the "keystore-bundle" artifact (a .zip).
#   3. Unzip it:
#        - back up magicmaker-release.jks somewhere safe, AND
#        - open SECRETS.txt and paste the values into
#          repo Settings -> Secrets and variables -> Actions -> New repository secret.
#   4. Delete this workflow file once you've saved everything.
#
# Nothing is printed to the logs; the artifact is only downloadable by repo members.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        default: "magicmaker"
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore + bundle
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          mkdir -p out
          PW="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore out/magicmaker-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=MagicMaker, OU=Mobile, O=MagicMaker, L=NA, ST=NA, C=US"

          base64 -w0 out/magicmaker-release.jks > out/KEYSTORE_BASE64.txt

          cat > out/SECRETS.txt <<EOF
          Paste these into:
            repo Settings -> Secrets and variables -> Actions -> New repository secret

            KEYSTORE_BASE64   = (the single line inside KEYSTORE_BASE64.txt in this zip)
            KEYSTORE_PASSWORD = $PW
            KEY_ALIAS         = $ALIAS
            KEY_PASSWORD      = $PW

          Still needed for OTA downloads (create separately):
            UPDATE_TOKEN      = a fine-grained read-only PAT (Contents: Read on this repo)

          IMPORTANT
            - Back up magicmaker-release.jks. If you lose it you can never update
              already-installed builds (Android rejects a changed signature).
            - Keep this zip private; it contains your signing password.
          EOF

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: out/
          retention-days: 1
